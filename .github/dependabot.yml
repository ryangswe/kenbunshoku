# SPDX-License-Identifier: Apache-2.0
#
# Dependency updates: one grouped pull request a month per ecosystem. Each one goes through the
# same checks as any other pull request. A person reads it before merging, except the small
# updates of test tools and types that .github/workflows/dependabot-auto-merge.yml queues for
# auto-merge once the required checks pass. The groups named *-checks hold those tools, so
# they arrive apart from everything else (a major update of one still goes to the main group).
#
# Held:
#   - onnxruntime-web: it must match the vendored runtime (vendor/cardvision-browser/cardvision-vendor.json)
#     and the release it was measured on; the build refuses a mismatch. Moving it means
#     re-vendoring the runtime, which is its own change.
#   - @types/node 25 and later: the types stay on the Node versions CI runs (22 and 24).
# media/reel/ (the launch reel's tooling) is not covered: it is pinned so the reel renders the same.
version: 2
updates:
  - package-ecosystem: npm
    directory: /
    schedule:
      interval: monthly
    groups:
      npm-checks:
        dependency-type: development
        patterns: ["@types/*", "happy-dom", "typescript", "vitest", "@vitest/*"]
        update-types: [minor, patch]
      npm-dependencies:
        patterns: ["*"]
    ignore:
      - dependency-name: onnxruntime-web
      - dependency-name: "@types/node"
        versions: [">=25"]
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: monthly
    groups:
      github-actions:
        patterns: ["*"]
