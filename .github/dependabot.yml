# SPDX-License-Identifier: Apache-2.0
#
# Dependency updates: one grouped pull request a month per ecosystem. Each one goes through the
# same checks as any other pull request, and a person reads it before merging.
#
# Held:
#   - onnxruntime-web: it must match the vendored runtime (vendor/cardvision-browser/VENDOR.json)
#     and the release it was measured on; the build refuses a mismatch. Moving it means
#     re-vendoring the runtime, which is its own change.
#   - @types/node 25 and later: the types stay on the Node versions CI runs (22 and 24).
# media/reel/ (the launch reel's tooling) is not covered: it is pinned so the reel renders the same.
version: 2
updates:
  - package-ecosystem: npm
    directory: /
    schedule:
      interval: monthly
    groups:
      npm-dependencies:
        patterns: ["*"]
    ignore:
      - dependency-name: onnxruntime-web
      - dependency-name: "@types/node"
        versions: [">=25"]
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: monthly
    groups:
      github-actions:
        patterns: ["*"]
