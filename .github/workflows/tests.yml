# SPDX-License-Identifier: Apache-2.0
#
# The tests (npm test: the type check, then vitest) on every pull request and every push to main,
# on the oldest Node.js the package supports and a newer one, and the type-aware lint (npm run lint),
# which finds unhandled promises and switches that miss a case. Before them, the toolkit's
# stand-alone checker confirms that vendor/cardvision-browser/ is what its manifest records. Then a real build for Chrome and for
# Firefox, with the model release the extension bundles, and addons.mozilla.org's linter on the
# Firefox build. The build itself refuses a text file too large for that linter
# (scripts/package-size.mjs).
#
# The release is downloaded from the public model repository on Hugging Face at the commit pinned
# in scripts/bundled-release.json, and release.json is checked against the SHA-256 pinned there
# (scripts/fetch-release.mjs; the build then checks every file against release.json). The store
# build reads the same pin. When the bundled release moves (release-legal/NOTICE names it), move
# both values in that file.
#
# The hover browser test (test/browser/hover-browser.mjs) loads a dev build in headless Chrome for
# Testing on a local page with a clip rendered from official card pictures fetched at setup, and
# asserts the hover behaviors (frames at play, the card's picture, the outline, the kept card, the
# switches, the idle unload, no request leaving the machine). Chrome needs one kernel setting on
# Ubuntu 24.04: AppArmor otherwise blocks the user namespaces of its sandbox ("No usable sandbox").
# The smoke scripts in test/smoke/ print and assert nothing; they stay local tools.
name: Tests

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: tests-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  tests:
    name: Node ${{ matrix.node }}
    runs-on: ubuntu-latest
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        node: [22, 24]
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: ${{ matrix.node }}
          cache: npm
      - run: npm ci
      - name: The vendored runtime matches its manifest
        run: npm run vendor-check
      - run: npm run typecheck
      - run: npm run lint
      - run: npm test

  build:
    name: Build for Chrome and Firefox
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - name: Download the bundled model release
        run: node scripts/fetch-release.mjs --out "$RUNNER_TEMP/release"
      - name: Build for Chrome
        run: npm run build -- --release "$RUNNER_TEMP/release" --out dist
      - name: Build for Firefox
        run: npm run build -- --release "$RUNNER_TEMP/release" --target firefox --out dist-firefox
      - name: Lint the Firefox build as addons.mozilla.org does
        # Errors fail the job. The warnings (eval and dynamic import) come from ONNX Runtime's
        # bundled code.
        run: npx --yes web-ext@8.10.0 lint --source-dir dist-firefox --output text

  hover-browser:
    name: Hover browser test
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - name: Download the bundled model release
        run: node scripts/fetch-release.mjs --out "$RUNNER_TEMP/release"
      - name: Build two dev builds (the second unloads after 6 idle seconds)
        run: |
          npm run build -- --dev --release "$RUNNER_TEMP/release" --out dist
          npm run build -- --dev --release "$RUNNER_TEMP/release" --idle-unload-ms 6000 --out dist-idle
      - name: Install Chrome for Testing, puppeteer-core and ffmpeg
        run: |
          set -eu
          npm install --no-save --prefix "$RUNNER_TEMP/pcore" puppeteer-core@25.17.0
          # Pinned, so a new Chrome release never changes a run on its own: move both pins together.
          npx --yes @puppeteer/browsers@3.2.7 install chrome@157.0.8103.78 --path "$RUNNER_TEMP/cft" | tee "$RUNNER_TEMP/cft.txt"
          echo "CHROME=$(tail -n1 "$RUNNER_TEMP/cft.txt" | cut -d' ' -f2-)" >> "$GITHUB_ENV"
          sudo apt-get update -qq
          sudo apt-get install -y -qq ffmpeg
          sudo sysctl -w kernel.apparmor_restrict_unprivileged_userns=0
      - name: Run the hover browser test
        env:
          PUPPETEER_CORE_DIR: ${{ runner.temp }}/pcore
        run: |
          node test/browser/hover-browser.mjs --chrome "$CHROME" --release "$RUNNER_TEMP/release" \
            --art "$RUNNER_TEMP/art" --fetch-art --dist dist --dist-idle dist-idle --out "$RUNNER_TEMP/hover-browser"
      - name: Keep the report, the event log and the NetLogs
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: hover-browser
          path: ${{ runner.temp }}/hover-browser
          if-no-files-found: warn
